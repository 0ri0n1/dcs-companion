name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: webapp/requirements-lock.txt
      - run: python -m pip install -r webapp/requirements-lock.txt
      - run: python -m pytest -q
        working-directory: webapp
  frontend:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm test
